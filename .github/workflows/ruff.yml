name: Ruff
on: [push, pull_request]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Ruff version is read from pyproject.toml so CI matches local/pre-commit
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: pyproject.toml
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: pyproject.toml
          args: format --check
